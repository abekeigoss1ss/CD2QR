<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M5StickC Plus2 専用QRコード発行パネル</title>
    <!-- 本物のQRコードを生成する外部ライブラリ（QRious）を読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 20px; background: #eef2f7; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #007bff; font-size: 1.6rem; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.95rem; }
        input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        textarea { height: 80px; resize: none; }
        .btn { background: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 1.1rem; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #0056b3; }
        .result-box { margin-top: 30px; padding-top: 20px; border-top: 2px dashed #ccc; display: none; }
        h2 { color: #28a745; font-size: 1.3rem; }
        #qrcode-canvas { display: inline-block; margin: 20px 0; padding: 10px; background: white; border: 1px solid #eee; }
        .info-preview { text-align: left; background: #f8f9fa; padding: 12px; border-radius: 6px; border-left: 5px solid #28a745; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h1 id="pageTitle">M5データ QRコード作成パネル</h1>
    
    <div id="formArea">
        <div class="form-group">
            <label>お名前</label>
            <input type="text" id="inputName" placeholder="例：山田 たろう">
        </div>
        <div class="form-group">
            <label>学年</label>
            <select id="inputGrade">
                <option value="1年">1年</option>
                <option value="2年">2年</option>
                <option value="3年">3年</option>
            </select>
        </div>
        <div class="form-group">
            <label>性別</label>
            <select id="inputGender">
                <option value="男">男</option>
                <option value="女">女</option>
            </select>
        </div>
        <div class="form-group">
            <label>要件</label>
            <textarea id="inputReq" placeholder="例：液晶の文字を赤色にする、など"></textarea>
        </div>
        <button class="btn" onclick="generateUserQR()">専用QRコードを発行する</button>
    </div>

    <div id="resultArea" class="result-box">
        <h2>専用ページへのQRコード</h2>
        <div>
            <canvas id="qrcode-canvas"></canvas>
        </div>
        
        <div class="info-preview">
            <p><strong>名前:</strong> <span id="previewName"></span></p>
            <p><strong>学年:</strong> <span id="previewGrade"></span></p>
            <p><strong>性別:</strong> <span id="previewGender"></span></p>
            <p><strong>要件:</strong> <span id="previewReq"></span></p>
        </div>
        <button class="btn" style="background: #6c757d;" onclick="resetForm()">別の人を作成する</button>
    </div>
</div>

<script>
    // URLのパラメータチェック処理
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('name')) {
        document.getElementById('pageTitle').textContent = "個人専用設定データ";
        document.getElementById('formArea').style.display = "none";
        document.getElementById('previewName').textContent = urlParams.get('name');
        document.getElementById('previewGrade').textContent = urlParams.get('grade');
        document.getElementById('previewGender').textContent = urlParams.get('gender');
        document.getElementById('previewReq').textContent = urlParams.get('req') || "なし";
        document.getElementById('resultArea').style.display = "block";
        document.getElementById('resultArea').style.borderTop = "none";
        document.getElementById('resultArea').querySelector('h2').style.display = "none";
        document.getElementById('resultArea').querySelector('button').style.display = "none";
    }

    // ライブラリを使用して本物のQRコードをキャンバスに描画する関数
    function drawQRtoCanvas(canvasId, text) {
        new QRious({
            element: document.getElementById(canvasId),
            value: text,
            size: 200,
            background: 'white',
            foreground: 'black',
            level: 'H' // 誤り訂正レベル（H: 高い検出率）
        });
    }

    // ボタンを押してQRコードを作る処理
    function generateUserQR() {
        const name = document.getElementById('inputName').value.trim();
        const grade = document.getElementById('inputGrade').value;
        const gender = document.getElementById('inputGender').value;
        const req = document.getElementById('inputReq').value.trim() || "なし";

        if(name === "") {
            alert("お名前を入力してください。");
            return;
        }

        // 固定の公開用URLを指定
        const baseUrl = "https://abekeigoss1ss.github.io/CD2QR/";
        const targetUrl = baseUrl + '?name=' + encodeURIComponent(name) + '&grade=' + encodeURIComponent(grade) + '&gender=' + encodeURIComponent(gender) + '&req=' + encodeURIComponent(req);

        // QRコード描画
        drawQRtoCanvas('qrcode-canvas', targetUrl);

        // プレビュー部分に文字をセット
        document.getElementById('previewName').textContent = name;
        document.getElementById('previewGrade').textContent = grade;
        document.getElementById('previewGender').textContent = gender;
        document.getElementById('previewReq').textContent = req;

        // 画面切り替え
        document.getElementById('formArea').style.display = "none";
        document.getElementById('resultArea').style.display = "block";
    }

    function resetForm() {
        document.getElementById('inputName').value = "";
        document.getElementById('inputReq').value = "";
        document.getElementById('formArea').style.display = "block";
        document.getElementById('resultArea').style.display = "none";
    }
</script>
</body>
</html>
